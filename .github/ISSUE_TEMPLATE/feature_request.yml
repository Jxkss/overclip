name: Feature idea
description: Suggest something new or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you're trying to achieve; the "why" helps more than a solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Overclip help?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mock-ups, examples from other apps…
